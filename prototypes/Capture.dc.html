<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Capture menu and toast</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&amp;family=Geist+Mono:wght@500&amp;display=swap">
<style>
body{margin:0;background:#0B0C0E}
a{color:#A3A6B1}a:hover{color:#ECEDF1}
.mi:hover{background-color:#2A2C33 !important}
button:focus-visible,a:focus-visible{outline:2px solid #9AA8FF;outline-offset:2px}
</style>
</helmet>
<div style="position:relative;width:880px;height:560px;box-sizing:border-box;padding:28px 32px;background:#0B0C0E;color:#ECEDF1;font-family:Geist,ui-sans-serif,system-ui,sans-serif;font-size:14px;line-height:1.5;overflow:hidden">
<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:20px">
<div style="width:220px;height:32px;border-radius:999px;background:#17181C;border:1px solid #22242A"></div>
<span style="display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;background:#17181C;border:1px solid #2A2C33;font-size:12.5px;color:#A3A6B1"><span style="font-family:'Geist Mono',ui-monospace,monospace;color:#ECEDF1">Middle-click</span>queues<span style="color:#5E616C">·</span><span style="font-family:'Geist Mono',ui-monospace,monospace;color:#ECEDF1">Shift + middle-click</span>opens a tab</span>
</div>
<div style="display:grid;grid-template-columns:repeat(3, minmax(0, 1fr));gap:20px">
<sc-for list="{{tiles}}" as="t" hint-placeholder-count="6"><div style="display:flex;flex-direction:column;gap:8px"><div style="{{t.thumbStyle}}"></div><div style="height:10px;width:85%;border-radius:4px;background:#1E2026"></div><div style="height:10px;width:55%;border-radius:4px;background:#181A1E"></div></div></sc-for>
</div>
<div role="menu" aria-label="Link menu" style="position:absolute;left:440px;top:132px;width:228px;padding:5px;border-radius:10px;background:#1E2026;border:1px solid #30323A;box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:13px">
<button role="menuitem" class="mi" style="width:100%;display:block;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#C9CBD3;font:inherit;text-align:left">Open link in new tab</button>
<button role="menuitem" class="mi" style="width:100%;display:block;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#C9CBD3;font:inherit;text-align:left">Open link in new window</button>
<button role="menuitem" class="mi" style="width:100%;display:block;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#C9CBD3;font:inherit;text-align:left">Copy link address</button>
<div style="height:1px;margin:5px 4px;background:#30323A"></div>
<button role="menuitem" aria-haspopup="menu" aria-expanded="true" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;border:none;background:{{accentSoft}};color:#ECEDF1;font:inherit;font-weight:500;text-align:left"><span style="display:flex;align-items:center;gap:8px"><span style="width:14px;height:14px;border-radius:4px;background:{{accent}};display:flex;align-items:center;justify-content:center"><svg width="9" height="9" viewBox="0 0 16 16" fill="none" stroke="#101114" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M3 4h10M3 8h10M3 12h6"></path></svg></span>Send to queue</span><svg width="12" height="12" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 3.5L10.5 8 6 12.5"></path></svg></button>
</div>
<div role="menu" aria-label="Send to queue" style="position:absolute;left:672px;top:206px;width:176px;padding:5px;border-radius:10px;background:#1E2026;border:1px solid #30323A;box-shadow:0 16px 40px rgba(0,0,0,.5);font-size:13px">
<button role="menuitem" class="mi" style="width:100%;display:flex;align-items:center;justify-content:space-between;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#ECEDF1;font:inherit;text-align:left">Inbox<span style="color:#8C8F9B;font-size:12px">default</span></button>
<button role="menuitem" class="mi" style="width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:#2A2C33;color:#ECEDF1;font:inherit;text-align:left"><span style="width:8px;height:8px;border-radius:3px;background:{{accent}}"></span>Programming</button>
<button role="menuitem" class="mi" style="width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#ECEDF1;font:inherit;text-align:left"><span style="width:8px;height:8px;border-radius:3px;background:#E58FB8"></span>Fun</button>
<button role="menuitem" class="mi" style="width:100%;display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#ECEDF1;font:inherit;text-align:left"><span style="width:8px;height:8px;border-radius:3px;background:#6FD3C4"></span>Long talks</button>
<div style="height:1px;margin:5px 4px;background:#30323A"></div>
<button role="menuitem" class="mi" style="width:100%;display:block;padding:6px 10px;border-radius:6px;border:none;background:transparent;color:#A3A6B1;font:inherit;text-align:left">New queue…</button>
</div>
<div role="status" style="position:absolute;left:32px;bottom:28px;width:360px;box-sizing:border-box;display:flex;align-items:center;gap:12px;padding:10px 10px 10px 12px;border-radius:12px;background:#1E2026;border:1px solid #30323A;box-shadow:0 16px 40px rgba(0,0,0,.5)">
<div style="flex:none;width:56px;height:32px;border-radius:6px;background:#1F3B2B"></div>
<div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column">
<span style="font-weight:500;font-size:13.5px">Added to Programming</span>
<span style="font-size:12.5px;color:#A3A6B1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">Inside the Go scheduler · rule: channel</span>
</div>
<button style="flex:none;padding:5px 10px;border-radius:7px;border:1px solid #30323A;background:#24262C;color:#ECEDF1;font:inherit;font-size:13px;font-weight:500;cursor:pointer">Undo</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#9AA8FF","options":["#9AA8FF","#F2A65A","#6FD3C4","#E58FB8"]},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#9AA8FF';
    const tints = ['#1F2127', '#1F3B2B', '#1F2127', '#1F2127', '#1F2127', '#1F2127'];
    return {
      accent: accent,
      accentSoft: 'rgba(154,168,255,.16)',
      tiles: tints.map((c, i) => ({
        thumbStyle: 'aspect-ratio:16 / 9;max-width:100%;border-radius:10px;background:' + c + (i === 1 ? ';outline:2px solid ' + accent + ';outline-offset:2px' : '')
      }))
    };
  }
}
</script>
</body>
</html>
